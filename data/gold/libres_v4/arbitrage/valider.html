<style>
:root{--fond:#f7f7f5;--carte:#fff;--texte:#1d1d1b;--doux:#6b6b66;--bord:#e2e1dc;--ok:#1f7a4d;--non:#b3261e;
--avant:#fde7e4;--apres:#dff3e8}
body{margin:0;background:var(--fond);color:var(--texte);font:15px/1.55 system-ui,sans-serif}
header{position:sticky;top:0;background:var(--fond);border-bottom:1px solid var(--bord);padding:12px 16px;z-index:1}
h1{font-size:17px;margin:0 0 4px}.barre{display:flex;gap:12px;align-items:center;flex-wrap:wrap;color:var(--doux)}
main{max-width:860px;margin:0 auto;padding:16px}
.carte{background:var(--carte);border:1px solid var(--bord);border-radius:10px;padding:14px 16px;margin:0 0 12px}
.carte.ok{border-color:var(--ok)}.carte.non{border-color:var(--non);opacity:.7}
.meta{font-size:13px;color:var(--doux);margin-bottom:6px}.texte{white-space:pre-wrap}
.texte[dir=rtl]{text-align:right}.avant{background:var(--avant)}.apres{background:var(--apres);font-weight:600}
.diff{margin:8px 0;font-size:14px}button{font:inherit;border:1px solid var(--bord);background:#fff;border-radius:8px;
padding:6px 14px;cursor:pointer}button.ok{border-color:var(--ok);color:var(--ok)}button.non{border-color:var(--non);
color:var(--non)}button:active{transform:translateY(1px)}#exporter{background:var(--texte);color:#fff;border:0}

<script>
const CARTES=[{"id": "R4-000", "regle": 4, "passage_id": "lib_en_500_p004", "lang": "en", "texte": "Should you have any questions or need further clarification regarding this request, please do not hesitate to contact Mr. Zied Guesmi, our internal auditor. He can be reached via email at z.guesmi@sawo.tn or by phone at +216 35 724 232. We look forward to the possibility of working with your students and contributing to the continuous improvement of our manufacturing processes.", "avant": null, "apres": {"start": 326, "end": 348, "label": "PROCESSUS", "text": "continuous improvement"}}, {"id": "R4-001", "regle": 4, "passage_id": "lib_ar_501_p001", "lang": "ar", "texte": "لدينا بيانات متوفرة حول الوقت المستغرق لتغيير السلسلة في كل من الأماكن، ونجد أنه يجب ألا يتجاوز هذا الوقت 20 دقيقة. كما أن الاستثمار المحدد بسقف قدره 20000 دينار هو المتوقع لحل هذه المشكلة.", "avant": null, "apres": {"start": 40, "end": 53, "label": "PROCESSUS", "text": "تغيير السلسلة"}}, {"id": "R2-002", "regle": 2, "passage_id": "lib_ar_502_p004", "lang": "ar", "texte": "الاستثمار المخصص لهذا المشروع محدود بسقف 15000 دينار، ومن المهم أن تتم دراسة القضية وتقديم الحلول في غضون 6 أسابيع فقط.", "avant": {"start": 55, "end": 118, "label": "CONTRAINTE", "text": "من المهم أن تتم دراسة القضية وتقديم الحلول في غضون 6 أسابيع فقط", "ref": "contrainte_1"}, "apres": {"start": 67, "end": 118, "label": "CONTRAINTE", "text": "تتم دراسة القضية وتقديم الحلول في غضون 6 أسابيع فقط", "ref": "contrainte_1"}}, {"id": "R4-003", "regle": 4, "passage_id": "lib_ar_503_p002", "lang": "ar", "texte": "تواجه الشركة التونسية عليسة للمخابر في وحدة الأكياس الفوارة مشكلة في التغيب الزائد من قبل العمال، حيث بلغت نسبة التغيب 9% مما أثر على الإنتاجية بشكل كبير. بالإضافة إلى ذلك، هناك مشكلة أخرى في عملية تغيير السلسلة التي تستغرق وقتاً طويلاً ويتعدى 15 دقيقة مما يؤثر سلباً على إنتاجية الوحدة.", "avant": null, "apres": {"start": 198, "end": 211, "label": "PROCESSUS", "text": "تغيير السلسلة"}}, {"id": "R4-004", "regle": 4, "passage_id": "lib_ar_503_p004", "lang": "ar", "texte": "يُطلب من الطلاب القيام بتحليل هذه البيانات، وتحديد الأسباب المحتملة وراء ارتفاع نسبة التغيب في وحدة الأكياس الفوارة، والاقتراحات الممكنة لتقليل هذه النسبة. بالإضافة إلى ذلك، يجب أن يتم دراسة عملية تغيير السلسلة واقتراح طرق لتقليل الوقت المستغرق فيها.", "avant": null, "apres": {"start": 197, "end": 210, "label": "PROCESSUS", "text": "تغيير السلسلة"}}, {"id": "R4-005", "regle": 4, "passage_id": "lib_ar_504_p001", "lang": "ar", "texte": "من خلال المراقبة الدقيقة، نلاحظ أن عملية تغيير السلسلة في نفق التبخير تستغرق وقتًا طويلاً، حيث يبلغ المتوسط 40 دقيقة. هذا يشكل تحديًا كبيرًا في كفاءة الإنتاج ويزيد من التكلفة.", "avant": null, "apres": {"start": 41, "end": 54, "label": "PROCESSUS", "text": "تغيير السلسلة"}}, {"id": "R4-006", "regle": 4, "passage_id": "lib_ar_504_p003", "lang": "ar", "texte": "نطلب من طلاب المدرسة أن يقوموا بتقييم الوقت الحالي لعملية تغيير السلسلة، وتحديد العوامل التي تؤثر على هذا الوقت، واقتراح حلول لتحسين هذه العملية. يجب أن يتأكد الحريف النهائي من كل تعديل قبل تشغيل النفق مرة أخرى.", "avant": null, "apres": {"start": 58, "end": 71, "label": "PROCESSUS", "text": "تغيير السلسلة"}}, {"id": "R2-007", "regle": 2, "passage_id": "lib_en_501_p003", "lang": "en", "texte": "The students are tasked with conducting a comprehensive study on the current maintenance procedures and proposing solutions to reduce the MTTR to 40 minutes. They should also ensure that the changeover time between different product lines does not exceed 30 minutes, as per company standards.", "avant": {"start": 175, "end": 265, "label": "CONTRAINTE", "text": "ensure that the changeover time between different product lines does not exceed 30 minutes", "ref": "contrainte_1"}, "apres": {"start": 187, "end": 265, "label": "CONTRAINTE", "text": "the changeover time between different product lines does not exceed 30 minutes", "ref": "contrainte_1"}}, {"id": "R2-008", "regle": 2, "passage_id": "lib_fr_501_p004", "lang": "fr", "texte": "Contraintes : Les essais ne peuvent avoir lieu que le samedi. Nous devons également veiller à ce que la certification FSSC 22000 soit maintenue et mise à jour.", "avant": {"start": 62, "end": 158, "label": "CONTRAINTE", "text": "Nous devons également veiller à ce que la certification FSSC 22000 soit maintenue et mise à jour", "ref": "contrainte_1"}, "apres": {"start": 101, "end": 158, "label": "CONTRAINTE", "text": "la certification FSSC 22000 soit maintenue et mise à jour", "ref": "contrainte_1"}}, {"id": "R4-009", "regle": 4, "passage_id": "lib_en_502_p004", "lang": "en", "texte": "To complete this project within the set timeframe, the study must last no more than 7 weeks. Additionally, it is essential that the ISO 15378 certification for the HDPE pipes remains intact throughout the study period. This project will contribute significantly to our ongoing efforts in continuous improvement.", "avant": null, "apres": {"start": 288, "end": 310, "label": "PROCESSUS", "text": "continuous improvement"}}, {"id": "R4-010", "regle": 4, "passage_id": "lib_en_502_p005", "lang": "en", "texte": "The project should be completed by the end of the semester, and students will present their findings and recommendations to the Continuous Improvement Lead. Mr. Zied Guesmi, our Continuous Improvement Lead, can be reached via email at z.guesmi@bkpho.tn or phone at +216 56 242 238.", "avant": null, "apres": {"start": 128, "end": 150, "label": "PROCESSUS", "text": "Continuous Improvement"}}, {"id": "R4-011", "regle": 4, "passage_id": "lib_en_502_p005", "lang": "en", "texte": "The project should be completed by the end of the semester, and students will present their findings and recommendations to the Continuous Improvement Lead. Mr. Zied Guesmi, our Continuous Improvement Lead, can be reached via email at z.guesmi@bkpho.tn or phone at +216 56 242 238.", "avant": null, "apres": {"start": 178, "end": 200, "label": "PROCESSUS", "text": "Continuous Improvement"}}, {"id": "R2-012", "regle": 2, "passage_id": "lib_en_503_p004", "lang": "en", "texte": "The investment in new equipment or improvements is capped at TND 40,000. Therefore, any proposed solutions must be within this budget constraint. Additionally, we need to ensure that the BRCGS certification remains intact during any changes made to the production process.", "avant": {"start": 171, "end": 271, "label": "CONTRAINTE", "text": "ensure that the BRCGS certification remains intact during any changes made to the production process", "ref": "contrainte_1"}, "apres": {"start": 183, "end": 271, "label": "CONTRAINTE", "text": "the BRCGS certification remains intact during any changes made to the production process", "ref": "contrainte_1"}}, {"id": "R2-013", "regle": 2, "passage_id": "lib_fr_503_p004", "lang": "fr", "texte": "Constrains : Les essais ne peuvent avoir lieu que le samedi et il est important de conserver la certification ISO 15378.", "avant": {"start": 63, "end": 119, "label": "CONTRAINTE", "text": "il est important de conserver la certification ISO 15378", "ref": "contrainte_1"}, "apres": {"start": 83, "end": 119, "label": "CONTRAINTE", "text": "conserver la certification ISO 15378", "ref": "contrainte_1"}}, {"id": "R4-014", "regle": 4, "passage_id": "lib_fr_503_p005", "lang": "fr", "texte": "Coordonnées de la personne à contacter : Pour toute information supplémentaire, veuillez contacter M. Haythem Sghaier, responsable amélioration continue. Vous pouvez le joindre à l'adresse e-mail h.sghaier@ccel.tn ou par téléphone au 72 505 838.", "avant": null, "apres": {"start": 131, "end": 152, "label": "PROCESSUS", "text": "amélioration continue"}}, {"id": "R4-015", "regle": 4, "passage_id": "lib_ar_508_p006", "lang": "ar", "texte": "للوصول إلى السيدة/السيد لطفي الناصري، مسؤول التحسين المستمر، الرجاء الاتصال بالرقم 75 917 635 أو البريد الإلكتروني l.nasri@rimel.tn.", "avant": null, "apres": {"start": 44, "end": 59, "label": "PROCESSUS", "text": "التحسين المستمر"}}, {"id": "R4-016", "regle": 4, "passage_id": "lib_ar_509_p003", "lang": "ar", "texte": "نطلب من الطلاب تنفيذ دراسة جدوى لتحسين كفاءة استخدام التحاميل. يجب عليهم تحديد الوقت المستغرق لتغيير السلسلة واقتراح طرق لخفض هذا الوقت دون التأثير على جودة المنتج.", "avant": null, "apres": {"start": 95, "end": 108, "label": "PROCESSUS", "text": "تغيير السلسلة"}}, {"id": "R4-017", "regle": 4, "passage_id": "lib_ar_511_p004", "lang": "ar", "texte": "يجب أن يتم العمل في هذا المشروع بشكل مستقل، ولكن يمكن التواصل مع مسؤول التحسين المستمر السيد منتصر البحري للحصول على المشورة إذا لزم الأمر. يمكن الاتصال به على الرقم +216 80 842 721 أو البريد الإلكتروني m.bahri@dougga.tn.", "avant": null, "apres": {"start": 71, "end": 86, "label": "PROCESSUS", "text": "التحسين المستمر"}}, {"id": "R4-018", "regle": 4, "passage_id": "lib_en_509_p005", "lang": "en", "texte": "If you have any questions or need further information, please contact Mr. Wael Ghorbel, the continuous improvement lead, at 79 216 349 or via email at w.ghorbel@dcwo.tn.", "avant": null, "apres": {"start": 92, "end": 114, "label": "PROCESSUS", "text": "continuous improvement"}}, {"id": "R2-019", "regle": 2, "passage_id": "lib_en_510_p004", "lang": "en", "texte": "The task is subject to several constraints, including the need to ensure that all proposed solutions are cost-effective and align with the company’s sustainability goals. The students must adhere to these constraints while conducting their analysis and presenting their findings.", "avant": {"start": 66, "end": 119, "label": "CONTRAINTE", "text": "ensure that all proposed solutions are cost-effective", "ref": "contrainte_0"}, "apres": {"start": 78, "end": 119, "label": "CONTRAINTE", "text": "all proposed solutions are cost-effective", "ref": "contrainte_0"}}, {"id": "R4-020", "regle": 4, "passage_id": "lib_fr_510_p001", "lang": "fr", "texte": "Un problème persiste lorsque des changements de série sont effectués, où le rendement ne dépasse pas 83% du premier passage. Cette situation met en lumière la nécessité d'améliorer la fluidité du changement de série. Des données de gestion visuelle Kanban sont disponibles, mais elles ne suffisent pas pour résoudre le problème.", "avant": null, "apres": {"start": 33, "end": 53, "label": "PROCESSUS", "text": "changements de série"}}, {"id": "R4-021", "regle": 4, "passage_id": "lib_fr_510_p001", "lang": "fr", "texte": "Un problème persiste lorsque des changements de série sont effectués, où le rendement ne dépasse pas 83% du premier passage. Cette situation met en lumière la nécessité d'améliorer la fluidité du changement de série. Des données de gestion visuelle Kanban sont disponibles, mais elles ne suffisent pas pour résoudre le problème.", "avant": null, "apres": {"start": 196, "end": 215, "label": "PROCESSUS", "text": "changement de série"}}, {"id": "R4-022", "regle": 4, "passage_id": "lib_fr_510_p002", "lang": "fr", "texte": "Nous demandons aux étudiants de concevoir un système permettant de gérer efficacement les changements de série, afin que ces derniers ne dépassent pas 30 minutes. Toutes les modifications doivent être validées par le client final avant la mise en œuvre. Un étudiant sera chargé de piloter cette ligne de production, et le coût de production actuel est de 49,78 DT par unité.", "avant": null, "apres": {"start": 90, "end": 110, "label": "PROCESSUS", "text": "changements de série"}}, {"id": "R4-023", "regle": 4, "passage_id": "lib_fr_510_p003", "lang": "fr", "texte": "Le projet devra respecter certaines contraintes, notamment le respect du temps de changement de série et la validation finale par le client. L'objectif est d'améliorer la productivité tout en maintenant la qualité du produit.", "avant": null, "apres": {"start": 82, "end": 101, "label": "PROCESSUS", "text": "changement de série"}}, {"id": "R4-024", "regle": 4, "passage_id": "lib_en_511_p003", "lang": "en", "texte": "The work assigned to the students is to analyze the production line, focusing on the fuse box and the ultrasonic welding station. They should identify potential causes of the malfunction and propose solutions to prevent future occurrences. Additionally, they need to suggest ways to reduce the changeover time from the current 20 minutes to meet the company’s target of no more than 15 minutes.", "avant": null, "apres": {"start": 294, "end": 304, "label": "PROCESSUS", "text": "changeover"}}, {"id": "R4-025", "regle": 4, "passage_id": "lib_en_511_p004", "lang": "en", "texte": "The students will also need to ensure that all process improvements comply with the ISO 50001 energy management system standards, maintaining the company’s certification. Continuous improvement initiatives must include value stream mapping to optimize workflow and reduce waste.", "avant": null, "apres": {"start": 171, "end": 193, "label": "PROCESSUS", "text": "Continuous improvement"}}, {"id": "R4-026", "regle": 4, "passage_id": "lib_en_511_p005", "lang": "en", "texte": "For any inquiries or further details, please contact Ms. Najla Kchaou, the continuous improvement lead, at her email address: n.kchaou@ncpl.tn or by phone at 73 383 115.", "avant": null, "apres": {"start": 75, "end": 97, "label": "PROCESSUS", "text": "continuous improvement"}}];const CLE="cf_regles_arbitrees_v1";
let dec={};try{dec=JSON.parse(localStorage.getItem(CLE)||"{}")}catch(e){}
const REGLES={2:"Règle 2 · contrainte sans son introduction",4:"Règle 4 · méthode nommée → PROCESSUS"};
function esc(s){return s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]))}
function marque(t,s,e,cl){return esc(t.slice(0,s))+'<span class="'+cl+'">'+esc(t.slice(s,e))+"</span>"+esc(t.slice(e))}
function rendre(){const L=document.getElementById("liste");L.innerHTML="";let n=0;
for(const c of CARTES){const d=dec[c.id];if(d)n++;const div=document.createElement("div");
div.className="carte"+(d==="ok"?" ok":d==="non"?" non":"");const rtl=c.lang==="ar"?' dir="rtl"':"";
let diff;if(c.avant){diff='<div class="diff">Avant : <span class="avant">'+esc(c.avant.text)+
'</span><br>Après : <span class="apres">'+esc(c.apres.text)+"</span> ("+c.apres.label+")</div>"}
else{diff='<div class="diff">Ajouter : <span class="apres">'+esc(c.apres.text)+"</span> en "+c.apres.label+"</div>"}
div.innerHTML='<div class="meta">'+c.id+" · "+REGLES[c.regle]+" · <code>"+c.passage_id+"</code></div>"+diff+
'<div class="texte"'+rtl+">"+marque(c.texte,c.apres.start,c.apres.end,"apres")+"</div>"+
'<p><button class="ok">Accepter</button> <button class="non">Refuser</button></p>';
div.querySelector(".ok").onclick=()=>{dec[c.id]="ok";sauver()};div.querySelector(".non").onclick=()=>{dec[c.id]="non";sauver()};
L.appendChild(div)}document.getElementById("compte").textContent=n+" / "+CARTES.length+" décidées"}
function sauver(){try{localStorage.setItem(CLE,JSON.stringify(dec))}catch(e){}rendre()}
document.getElementById("exporter").onclick=()=>{const manque=CARTES.filter(c=>!dec[c.id]).length;
if(manque&&!confirm(manque+" proposition(s) sans décision : elles seront refusées. Exporter quand même ?"))return;
const blob=new Blob([JSON.stringify({annotateur:"ons",date:new Date().toISOString(),decisions:dec},null,1)],
{type:"application/json"});const a=document.createElement("a");a.href=URL.createObjectURL(blob);
a.download="decisions_regles_ons.json";a.click()};rendre();
</script></body></html>
