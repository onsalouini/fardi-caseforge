<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Relecture des fiches</title>
<style>
:root{--bg:#f6f5f2;--card:#fff;--ink:#1d1d1f;--mute:#6b6b70;--line:#e2e0da;--acc:#2a6f5b;--warn:#b54a2c;--sel:#e7f2ee}
@media (prefers-color-scheme:dark){:root{--bg:#18191b;--card:#222326;--ink:#ececec;--mute:#9a9aa0;--line:#35363a;--acc:#5cc2a0;--warn:#e38a6b;--sel:#21362f}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,Segoe UI,sans-serif}
header{position:sticky;top:0;z-index:2;background:var(--card);border-bottom:1px solid var(--line);padding:10px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
header b{font-size:16px}select,button,textarea{font:inherit;color:inherit}
select,button{padding:6px 10px;border:1px solid var(--line);border-radius:8px;background:var(--card);cursor:pointer}
button.p{background:var(--acc);color:#fff;border-color:var(--acc)}
.prog{color:var(--mute);margin-left:auto}
main{max-width:1300px;margin:0 auto;padding:16px}
.nav{display:flex;gap:8px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
.dots{display:flex;gap:4px;flex-wrap:wrap}.dot{width:26px;height:26px;border-radius:6px;border:1px solid var(--line);font-size:12px;display:grid;place-items:center;cursor:pointer;background:var(--card)}
.dot.done{background:var(--acc);color:#fff;border-color:var(--acc)}.dot.cur{outline:2px solid var(--ink)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}@media(max-width:850px){.grid{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px}
h3{margin:0 0 8px;font-size:14px;text-transform:uppercase;letter-spacing:.04em;color:var(--mute)}
.src{white-space:pre-wrap;max-height:70vh;overflow:auto}.src p{margin:0 0 10px}.tag{font-family:monospace;font-size:12px;background:var(--sel);padding:1px 5px;border-radius:4px}
.src p.hl{background:var(--sel);border-radius:6px}
.fi{white-space:pre-wrap;margin-bottom:12px}
.crit{display:grid;grid-template-columns:1fr auto;gap:6px 10px;align-items:center;padding:6px 0;border-top:1px solid var(--line)}
.crit small{display:block;color:var(--mute)}
.sc{display:flex;gap:4px}.sc button{width:38px}.sc button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.sc button.on.z{background:var(--warn);border-color:var(--warn)}
textarea{width:100%;min-height:60px;border:1px solid var(--line);border-radius:8px;padding:8px;background:var(--card)}
.tot{font-weight:600;margin-top:8px}
[dir=rtl]{text-align:right}
</style></head><body>

function tot(){const s=st[list[i].doc_id];const n=C.filter(c=>s[c[0]]!==undefined).length;const t=C.reduce((a,c)=>a+(s[c[0]]||0),0);
 const el=document.getElementById("tot");if(n<8){el.textContent=`${n}/8 critères notés`;return}
 const ok=t>=13&&s.invention>0&&s.anonymisation>0;el.innerHTML=`Total ${t}/16 — <span style="color:${ok?"var(--acc)":"var(--warn)"}">${ok?"fiche acceptée":"fiche à corriger"}</span>`}
function prog(){document.getElementById("prog").textContent=who?`${list.filter(done).length}/${list.length} fiches notées`:""}
document.getElementById("who").onchange=e=>{who=e.target.value;list=who==="Toutes"?D:D.filter(d=>SETS[who].includes(d.doc_id));i=0;render()};
document.getElementById("exp").onclick=()=>{if(!who||who==="Toutes"){alert("Choisis d'abord ton prénom (Ons ou Boutheina).");return}
 const out=list.filter(done).map(d=>{const s=st[d.doc_id];const r={doc_id:d.doc_id,empreinte:d.empreinte,relu_par:who,commentaire:s.commentaire||""};C.forEach(c=>r[c[0]]=s[c[0]]);return r});
 if(out.length<list.length&&!confirm(`${out.length}/${list.length} fiches complètes seulement. Télécharger quand même ?`))return;
 const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(out,null,1)],{type:"application/json"}));a.download=`relecture_${who.toLowerCase()}_${VERSION}.json`;a.click()};
</script></body></html>
