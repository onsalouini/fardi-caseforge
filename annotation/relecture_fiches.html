ement de série ياخو ساعة ونص.\n\n[p003] نحبو الطلبة يعملو دراسة SMED على الـ sertisseuse ويقترحو standard de travail للعملة.\n\n[p004] ما نجموش نوقفو الخط أكثر من 4 ساعات في الجمعة. لازم الحل يحترم مواصفة IATF 16949.\n\n[p005] عندنا الداتا متاع 8 أشهر في الـ MES. [DONNEE_MASQUEE] و [DONNEE_MASQUEE] سريين. تلفوني: [DONNEE_MASQUEE]", "obj": "- نحبو الطلبة يعملو دراسة SMED على الـ sertisseuse ويقترحو standard de travail للعملة.  [lib_ar_05_p003]", "don": "- TRS متاع الخط 2، طاح لـ 64 %  [lib_ar_05_p002]\n- الهدف 80 %  [lib_ar_05_p002]\n- ياخو ساعة ونص  [lib_ar_05_p002]", "con": "- ما نجموش نوقفو الخط أكثر من 4 ساعات في الجمعة  [lib_ar_05_p004]\n- لازم الحل يحترم مواصفة IATF 16949  [lib_ar_05_p004]"}, {"row": 7, "doc_id": "lib_ar_06", "split": "test", "lang": "ar", "doc": "[p000] كراس الشروط – مشروع رقمنة مراقبة الجودة – [ENTREPRISE_A] ب[SITE_1]\n\n[p001] 1. التقديم: تنتج المؤسسة قماش الجينز المصبوغ بالنيلة وتصدر 80 % من إنتاجها نحو أوروبا. يتم الفحص بالعين المجردة حاليا على طاولة الفحص الضوئية.\n\n[p002] 2. الإشكالية: تفوق نسبة شكايات الحرفاء المتعلقة بعيوب النسيج 3 %، ويستغرق فحص كل لفافة حوالي 12 دقيقة، مما يجعل قسم الفحص عنق زجاجة.\n\n[p003] 3. الحاجة: تصميم نظام رؤية حاسوبية يعتمد على كاميرا صناعية لكشف العيوب آليا وتصنيفها حسب نظام النقاط الأربع.\n\n[p004] 4. المتطلبات: يجب أن يكشف النظام 95 % على الأقل من العيوب الكبرى. لا يسمح بإبطاء سرعة الطاولة. يجب أن تكون الواجهة باللغة العربية والفرنسية.\n\n[p005] 5. المعطيات: 2000 صورة لعيوب مصنفة من طرف المراقبين. تبقى [DONNEE_MASQUEE] سرية. المسؤول عن المشروع: [PERSONNE_1].", "obj": "- 3. الحاجة: تصميم نظام رؤية حاسوبية يعتمد على كاميرا صناعية لكشف العيوب آليا وتصنيفها حسب نظام النقاط الأربع.  [lib_ar_06_p003]", "don": "- تصدر 80 % من إنتاجها نحو أوروبا  [lib_ar_06_p001]\n- نسبة شكايات الحرفاء المتعلقة بعيوب النسيج 3 %  [lib_ar_06_p002]\n- يستغرق فحص كل لفافة حوالي 12 دقيقة  [lib_ar_06_p002]", "con": "- يجب أن يكشف النظام 95 % على الأقل من العيوب الكبرى  [lib_ar_06_p004]\n- لا يسمح بإبطاء سرعة الطاولة  [lib_ar_06_p004]\n- يجب أن تكون الواجهة باللغة العربية والفرنسية  [lib_ar_06_p004]"}, {"row": 8, "doc_id": "lib_ar_07", "split": "train", "lang": "ar", "doc": "[p000] ملاحظات زيارة ميدانية – [ENTREPRISE_A] ب[SITE_1] – 9 أكتوبر\n\n[p001] استقبلنا [PERSONNE_1] رئيس قسم الصيانة. ينتج المصنع حديد التسليح وأسلاك الحديد للبناء انطلاقا من الخردة.\n\n[p002] المشكلة الأساسية: الأعطال المتكررة في الفرن الكهربائي ذي القوس، حيث بلغ متوسط الوقت بين عطلين 41 ساعة فقط، وكل توقف يكلف حوالي 5 ساعات إنتاج. كما أن استهلاك الأقطاب الكهربائية مرتفع.\n\n[p003] مقترحات للطلبة: بناء نظام صيانة تنبؤية يعتمد على قياسات الاهتزاز والحرارة، وتحسين تخطيط قطع الغيار.\n\n[p004] ملاحظات: الدخول إلى منطقة الصهر ممنوع على الطلبة. يجب ارتداء معدات الوقاية الفردية. لا يسمح بنشر أي صورة للمصنع.\n\n[p005] عدم ذكر: [DONNEE_MASQUEE]، و[DONNEE_MASQUEE].", "obj": "- مقترحات للطلبة: بناء نظام صيانة تنبؤية يعتمد على قياسات الاهتزاز والحرارة، وتحسين تخطيط قطع الغيار.  [lib_ar_07_p003]", "don": "- متوسط الوقت بين عطلين 41 ساعة فقط  [lib_ar_07_p002]\n- كل توقف يكلف حوالي 5 ساعات إنتاج  [lib_ar_07_p002]", "con": "- الدخول إلى منطقة الصهر ممنوع على الطلبة  [lib_ar_07_p004]\n- يجب ارتداء معدات الوقاية الفردية  [lib_ar_07_p004]\n- لا يسمح بنشر أي صورة للمصنع  [lib_ar_07_p004]"}, {"row": 9, "doc_id": "lib_ar_08", "split": "train", "lang": "ar", "doc": "[p000] استمارة تقديم مشكل صناعي – برنامج الشراكة بين الجامعة والمؤسسة\n\n[p001] اسم المؤسسة: [ENTREPRISE_A] | المدينة: [SITE_1] | عدد العمال: 160 | النشاط: صناعة الصناديق الكرتونية المموجة وأغلفة القوارير | المخاطب: [PERSONNE_1]\n\n[p002] وصف المشكل: تتجاوز نسبة الفضلات الورقية في آلة الطباعة والقص 9 %، ويتم برمجة الطلبيات يدويا مما يتسبب في تأخير 22 % من الطلبيات.\n\n[p003] النتائج المنتظرة: نموذج لجدولة الإنتاج وتقليص الفضلات عبر تحسين تجميع الطلبيات على اللفات.\n\n[p004] الشروط الخاصة: يجب أن يعمل الحل على برنامج Excel المتوفر. لا يمكن شراء آلة جديدة قبل سنة 2028.\n\n[p005] معطيات لا تنشر: [DONNEE_MASQUEE] و[DONNEE_MASQUEE].", "obj": "- النتائج المنتظرة: نموذج لجدولة الإنتاج وتقليص الفضلات عبر تحسين تجميع الطلبيات على اللفات.  [lib_ar_08_p003]", "don": "- نسبة الفضلات الورقية في آلة الطباعة والقص 9 %  [lib_ar_08_p002]\n- تأخير 22 % من الطلبيات  [lib_ar_08_p002]", "con": "- يجب أن يعمل الحل على برنامج Excel المتوفر  [lib_ar_08_p004]\n- لا يمكن شراء آلة جديدة قبل سنة 2028  [lib_ar_08_p004]"}, {"row": 10, "doc_id": "lib_en_01", "split": "dev", "lang": "en", "doc": "[p000] From: [PERSONNE_1] <[DONNEE_MASQUEE]>\nTo: Industrial Engineering Department\nSubject: Student project – composite curing issues\n\n[p001] Dear Professor,\n[ENTREPRISE_A] is a 300-employee subsidiary producing carbon-fibre interior panels and cabin brackets for regional aircraft. Our plant is located in the [SITE_1].\n\n[p002] Over the last two quarters, our first-pass yield on autoclave-cured panels dropped from 93% to 84%. Most rejects show porosity detected by ultrasonic inspection. We suspect inconsistent vacuum bagging or a drift in the autoclave temperature profile.\n\n[p003] We would like a team of students to perform a root cause analysis, build a statistical model linking curing parameters to porosity, and propose an updated work instruction for the lay-up operators.\n\n[p004] Please note: any process change must remain compliant with EN 9100 and be approved by our customer's quality team. Students cannot access the clean room without a 2-day training. The project must be delivered by June 2027.\n\n[p005] We can share anonymised autoclave logs and NDT reports for 1,400 panels. The [DONNEE_MASQUEE] and the [DONNEE_MASQUEE] are confidential.\nBest regards,\n[PERSONNE_1], Operations Excellence Manager, [DONNEE_MASQUEE]", "obj": "- We would like a team of students to perform a root cause analysis, build a statistical model linking curing parameters to porosity, and propose an updated work instruction for the lay-up operators.  [lib_en_01_p003]", "don": "- first-pass yield on autoclave-cured panels dropped from 93% to 84%  [lib_en_01_p002]", "con": "- any process change must remain compliant with EN 9100 and be approved by our customer's quality team  [lib_en_01_p004]\n- Students cannot access the clean room without a 2-day training  [lib_en_01_p004]\n- The project must be delivered by June 2027  [lib_en_01_p004]"}, {"row": 11, "doc_id": "lib_en_02", "split": "train", "lang": "en", "doc": "[p000] MINUTES – Operations review, [ENTREPRISE_A], [SITE_1] – 16 October 2026\n\n[p001] Attendees: [PERSONNE_1] (Plant Manager), [PERSONNE_2] (Food Safety Lead), [PERSONNE_3] (Maintenance Supervisor).\n\n[p002] Item 1 – Flour extraction rate on the durum wheat line fell to 71.5% against a 74% target. The roller mill gaps have not been recalibrated since the March overhaul.\n\n[p003] Item 2 – Two customer complaints about foreign bodies in semolina bags. Metal detector rejects increased by 40% month over month.\n\n[p004] Action: invite final-year students to run a capability study on the milling process and to redesign the preventive maintenance plan for the roller mills and the metal detector.\n\n[p005] Constraints: all work must follow the site's FSSC 22000 rules; the mill runs 24/7 and can only be stopped during the monthly sanitation shift; budget limited to TND 25,000.\n\n[p006] Confidential: [DONNEE_MASQUEE] and the [DONNEE_MASQUEE].", "obj": "- Action: invite final-year students to run a capability study on the milling process and to redesign the preventive maintenance plan for the roller mills and the metal detector.  [lib_en_02_p004]", "don": "- Flour extraction rate on the durum wheat line fell to 71.5% against a 74% target  [lib_en_02_p002]\n- Metal detector rejects increased by 40% month over month  [lib_en_02_p003]", "con": "- all work must follow the site's FSSC 22000 rules  [lib_en_02_p005]\n- can only be stopped during the monthly sanitation shift  [lib_en_02_p005]\n- budget limited to TND 25,000  [lib_en_02_p005]"}, {"row": 12, "doc_id": "lib_en_03", "split": "train", "lang": "en", "doc": "[p000] NON-CONFORMANCE REPORT NCR-0932 | Issued by: Quality Dept., [ENTREPRISE_A] | Site: [SITE_1]\n\n[p001] Product: smart meter main board SMB-3 | Lot: [DONNEE_MASQUEE] | Quantity inspected: 2,500 | Defective: 186 | Customer: European utility (name withheld)\n\n[p002] Defect description: insufficient solder and tombstoning on 0402 capacitors, found at in-circuit testing. Defect rate reached 7.4% on night shift, versus 1.9% on day shift. Issue started after the stencil was replaced.\n\n[p003] Containment: lot quarantined, 100% AOI re-inspection, rework by trained operators. 8D owner: [PERSONNE_1].\n\n[p004] Request to the university: analyse solder paste printing data, run a design of experiments on squeegee pressure and print speed, and propose an SPC dashboard.\n\n[p005] Requirements: corrective actions must be validated within 15 working days; no change to the reflow oven profile without customer approval; IPC-A-610 class 2 must be maintained.\n\n[p006] Internal only: [DONNEE_MASQUEE]; purchase order [DONNEE_MASQUEE].", "obj": "- Request to the university: analyse solder paste printing data, run a design of experiments on squeegee pressure and print speed, and propose an SPC dashboard.  [lib_en_03_p004]", "don": "- Defective: 186  [lib_en_03_p001]\n- Defect rate reached 7.4% on night shift  [lib_en_03_p002]\n- 1.9% on day shift  [lib_en_03_p002]", "con": "- corrective actions must be validated within 15 working days  [lib_en_03_p005]\n- no change to the reflow oven profile without customer approval  [lib_en_03_p005]\n- IPC-A-610 class 2 must be maintained  [lib_en_03_p005]"}, {"row": 13, "doc_id": "lib_en_04", "split": "test", "lang": "en", "doc": "[p000] Final-year internship offer – [ENTREPRISE_A], [SITE_1]\n\n[p001] [ENTREPRISE_A] manufactures liquid laundry detergent and dishwashing gel for supermarkets in Tunisia and Algeria. The plant runs two mixing tanks of 10 m3 and an automatic bottling line.\n\n[p002] Batch-to-batch viscosity variation is causing frequent rework: about 1 batch in 8 is out of specification. Raw material consumption is also 6% above the theoretical recipe.\n\n[p003] The intern will build a data-driven model of the mixing process, define optimal dosing sequences and implement a simple batch record system.\n\n[p004] The intern must comply with chemical safety rules and wear PPE in the production area. Formulas must never be copied or taken off site. Final report due within 4 months.\n\n[p005] Supervisor: [PERSONNE_1], Production Engineer ([DONNEE_MASQUEE]). [DONNEE_MASQUEE]. [DONNEE_MASQUEE] are confidential.", "obj": "- The intern will build a data-driven model of the mixing process, define optimal dosing sequences and implement a simple batch record system.  [lib_en_04_p003]", "don": "- about 1 batch in 8 is out of specification  [lib_en_04_p002]\n- Raw material consumption is also 6% above the theoretical recipe  [lib_en_04_p002]", "con": "- The intern must comply with chemical safety rules and wear PPE in the production area  [lib_en_04_p004]\n- Formulas must never be copied or taken off site  [lib_en_04_p004]\n- Final report due within 4 months  [lib_en_04_p004]"}, {"row": 14, "doc_id": "lib_en_05", "split": "test", "lang": "en", "doc": "[p000] SPECIFICATION – Energy monitoring for the glass furnace\nRequester: [ENTREPRISE_A], [SITE_1]\n\n[p001] 1. Background. [ENTREPRISE_A] produces flint glass bottles and jars for the beverage and food industries using an end-fired regenerative furnace (150 t/day).\n\n[p002] 2. Problem. Natural gas consumption per tonne of glass has increased by 9% in 18 months. Energy now represents 38% of production cost. There is no sub-metering per process area.\n\n[p003] 3. Scope. Design an energy monitoring system with IoT sensors on the furnace, forehearths and annealing lehr, and develop an energy performance indicator dashboard aligned with ISO 50001.\n\n[p004] 4. Requirements. Sensors must withstand 70 °C ambient temperature. Installation must be done without stopping the furnace. Total hardware cost must stay below TND 35,000.\n\n[p005] 5. Inputs. Gas bills (anonymised), furnace PLC data, production reports. The [DONNEE_MASQUEE] is not to be disclosed. Contact: [PERSONNE_1], Energy Manager.", "obj": "- 3. Scope. Design an energy monitoring system with IoT sensors on the furnace, forehearths and annealing lehr, and develop an energy performance indicator dashboard aligned with ISO 50001.  [lib_en_05_p003]", "don": "- Natural gas consumption per tonne of glass has increased by 9% in 18 months  [lib_en_05_p002]\n- Energy now represents 38% of production cost  [lib_en_05_p002]\n- energy performance indicator  [lib_en_05_p003]", "con": "- aligned with ISO 50001  [lib_en_05_p003]\n- Sensors must withstand 70 °C ambient temperature  [lib_en_05_p004]\n- Installation must be done without stopping the furnace  [lib_en_05_p004]\n- Total hardware cost must stay below TND 35,000  [lib_en_05_p004]"}, {"row": 15, "doc_id": "lib_en_06", "split": "train", "lang": "en", "doc": "[p000] Site visit notes – [ENTREPRISE_A], [SITE_1] – 8 Oct\n\n[p001] Met [PERSONNE_1] (owner) and the methods engineer. They make leather safety shoes and work boots, 2,200 pairs/day, mostly for a French distributor.\n\n[p002] Main pain points: sole bonding failures (customer returns ≈ 2.5%), and very long lead time between cutting and lasting – WIP is everywhere. The cutting press area has no layout logic.\n\n[p003] Also: high absenteeism on the stitching line (around 11%), which makes line balancing impossible to keep.\n\n[p004] Possible student topics: (1) peel test campaign and adhesive process window; (2) lean layout redesign with a value stream map; (3) skills matrix for multi-skilled operators.\n\n[p005] Owner's conditions: no stopping the cutting room in peak season (Feb–Apr); results presented internally first; no videos of operators.\n\n[p006] Not for publication: the [DONNEE_MASQUEE] and the [DONNEE_MASQUEE].", "obj": "- Possible student topics: (1) peel test campaign and adhesive process window; (2) lean layout redesign with a value stream map; (3) skills matrix for multi-skilled operators.  [lib_en_06_p004]", "don": "- 2,200 pairs/day  [lib_en_06_p001]\n- customer returns ≈ 2.5%  [lib_en_06_p002]\n- high absenteeism on the stitching line (around 11%)  [lib_en_06_p003]", "con": "- no stopping the cutting room in peak season (Feb–Apr)  [lib_en_06_p005]\n- results presented internally first  [lib_en_06_p005]\n- no videos of operators  [lib_en_06_p005]"}, {"row": 16, "doc_id": "lib_en_07", "split": "test", "lang": "en", "doc": "[p000] INDUSTRY PROBLEM SUBMISSION FORM – University–Industry Programme\n\n[p001] Company: [ENTREPRISE_A] | City: [SITE_1] | Employees: 95 | Activity: refrigerated transport and cold storage of dairy and frozen products | Contact person: [PERSONNE_1], Fleet Manager\n\n[p002] Problem description: our 38 refrigerated trucks travel 14% empty kilometres, and temperature excursions above 8 °C were recorded on 6% of deliveries last quarter. Route planning is done manually every evening.\n\n[p003] Expected outcome: a vehicle routing model with time windows, and an alert system based on the truck temperature loggers.\n\n[p004] Specific constraints: drivers' working time cannot exceed 9 hours per day; solution must run on our existing telematics platform; no personal data of drivers may be exported.\n\n[p005] Confidential information: [DONNEE_MASQUEE], [DONNEE_MASQUEE], [DONNEE_MASQUEE].", "obj": "- Expected outcome: a vehicle routing model with time windows, and an alert system based on the truck temperature loggers.  [lib_en_07_p003]", "don": "- travel 14% empty kilometres  [lib_en_07_p002]\n- temperature excursions above 8 °C were recorded on 6% of deliveries  [lib_en_07_p002]", "con": "- drivers' working time cannot exceed 9 hours per day  [lib_en_07_p004]\n- solution must run on our existing telematics platform  [lib_en_07_p004]\n- no personal data of drivers may be exported  [lib_en_07_p004]"}, {"row": 17, "doc_id": "lib_en_08", "split": "train", "lang": "en", "doc": "[p000] Subject: Proposal – tablet coating defects (urgent)\n\n[p001] Hello,\nI am the QA manager at [ENTREPRISE_A], a generics manufacturer in [SITE_1]. We produce film-coated metformin tablets and amoxicillin capsules for the local and West African markets.\n\n[p002] Since August, the coating pan has produced tablets with logo bridging and colour variation. The batch rejection rate rose to 3.2% and two batches were recalled by a distributor. Annual product quality review is due in January.\n\n[p003] We are looking for students to analyse coating process parameters (spray rate, inlet air temperature, pan speed) using multivariate analysis and suggest a control strategy.\n\n[p004] Conditions: GMP training is compulsory before any site access; batch records may only be consulted on site; any recommendation must be compatible with the registered manufacturing process.\n\n[p005] Please keep confidential: the [DONNEE_MASQUEE] and the [DONNEE_MASQUEE].\nKind regards,\n[PERSONNE_1]", "obj": "- We are looking for students to analyse coating process parameters (spray rate, inlet air temperature, pan speed) using multivariate analysis and suggest a control strategy.  [lib_en_08_p003]", "don": "- The batch rejection rate rose to 3.2%  [lib_en_08_p002]\n- two batches were recalled  [lib_en_08_p002]", "con": "- GMP training is compulsory before any site access  [lib_en_08_p004]\n- batch records may only be consulted on site  [lib_en_08_p004]\n- any recommendation must be compatible with the registered manufacturing process  [lib_en_08_p004]"}, {"row": 18, "doc_id": "lib_fr_01", "split": "train", "lang": "fr", "doc": "[p000] De : [PERSONNE_1] <[DONNEE_MASQUEE]>\nÀ : Département Génie Industriel\nObjet : RE: proposition de sujet – onduleurs qui chauffent\n\n[p001] Bonjour Madame,\nComme convenu au téléphone, je vous envoie le détail. Nous sommes [ENTREPRISE_A], PME de 140 personnes, et nous assemblons des kits photovoltaïques pour toitures (panneaux + onduleur hybride 5 kW) dans notre atelier de la [SITE_1].\n\n[p002] Depuis l'été, le taux de retour SAV des onduleurs est monté à 4,8 % (contre 1,2 % l'an dernier). La plupart des retours concernent un arrêt par surchauffe après 2 à 3 h de fonctionnement en plein soleil. On soupçonne le montage du dissipateur sur la carte de puissance, mais personne n'a eu le temps de creuser.\n\n[p003] Notre fournisseur de cartes, [ENTREPRISE_B], nous dit que leurs cartes sont conformes. Nous avons déjà changé la pâte thermique en septembre, sans effet visible.\n\n[p004] Ce qu'on attend des étudiants : une analyse des causes (on aimerait un diagramme d'Ishikawa et un plan d'expériences), puis une proposition de correction chiffrée sur la ligne de montage.\n\n[p005] Attention, l'atelier tourne en 2x8 et on ne peut pas immobiliser la ligne de test plus d'une demi-journée par semaine. Toute modification doit garder la certification IEC 62109 des onduleurs.\n\n[p006] Je peux fournir : les fiches SAV des 6 derniers mois (environ 310 retours), les relevés de la caméra thermique, la gamme de montage. Par contre nos prix d'achat des cartes ([DONNEE_MASQUEE]) et le [DONNEE_MASQUEE] ne doivent pas sortir de l'entreprise.\n\n[p007] Cordialement,\n[PERSONNE_1]\nResponsable industrialisation – [DONNEE_MASQUEE]", "obj": "- Ce qu'on attend des étudiants : une analyse des causes (on aimerait un diagramme d'Ishikawa et un plan d'expériences), puis une proposition de correction chiffrée sur la ligne de montage.  [lib_fr_01_p004]", "don": "- taux de retour SAV des onduleurs est monté à 4,8 %  [lib_fr_01_p002]\n- 1,2 % l'an dernier  [lib_fr_01_p002]", "con": "- on ne peut pas immobiliser la ligne de test plus d'une demi-journée par semaine  [lib_fr_01_p005]\n- Toute modification doit garder la certification IEC 62109 des onduleurs  [lib_fr_01_p005]"}, {"row": 19, "doc_id": "lib_fr_02", "split": "test", "lang": "fr", "doc": "[p000] COMPTE RENDU – Réunion qualité du 14/10 – [ENTREPRISE_A], usine de [SITE_1]\n\n[p001] Présents : [PERSONNE_1] (dir. qualité), [PERSONNE_2] (resp. cuisson), [PERSONNE_3] (maintenance). Excusé : le DG.\n\n[p002] Point 1 – Résistance du ciment CEM II/A-L 42,5 : sur les 3 dernières semaines, la résistance à 28 jours moyenne est tombée à 44,1 MPa, avec 9 % des lots sous le seuil client. Le four n°1 présente des variations de température de flamme importantes depuis le changement de combustible (passage au petcoke).\n\n[p003] Point 2 – Le broyeur à boulets BK2 consomme plus que prévu : 38 kWh/t contre 33 kWh/t visés. [PERSONNE_3] pense à une usure du blindage.\n\n[p004] Décision : proposer à l'[ENTREPRISE_B] un projet de fin d'études sur la maîtrise statistique de la qualité du clinker (cartes de contrôle, corrélation dosage cru / résistance) et une étude d'optimisation énergétique du broyage.\n\n[p005] Contraintes rappelées : le four ne doit jamais être arrêté pour l'étude ; les essais se font uniquement sur les prélèvements réglementaires. Les résultats doivent rester compatibles avec la norme NT 47.01.\n\n[p006] Données mises à disposition : historique laboratoire 2024-2026, relevés SCADA du four, consommations électriques par atelier. Le [DONNEE_MASQUEE] et les [DONNEE_MASQUEE] restent strictement internes.\n\n[p007] Prochaine réunion : 28/10. Rédacteur : [PERSONNE_1].", "obj": "- Décision : proposer à l'[ENTREPRISE_B] un projet de fin d'études sur la maîtrise statistique de la qualité du clinker (cartes de contrôle, corrélation dosage cru / résistance) et une étude d'optimisation énergétique du broyage.  [lib_fr_02_p004]", "don": "- résistance à 28 jours moyenne est tombée à 44,1 MPa  [lib_fr_02_p002]\n- 9 % des lots sous le seuil client  [lib_fr_02_p002]\n- 38 kWh/t contre 33 kWh/t visés  [lib_fr_02_p003]", "con": "- le four ne doit jamais être arrêté pour l'étude  [lib_fr_02_p005]\n- les essais se font uniquement sur les prélèvements réglementaires  [lib_fr_02_p005]\n- Les résultats doivent rester compatibles avec la norme NT 47.01  [lib_fr_02_p005]"}, {"row": 20, "doc_id": "lib_fr_03", "split": "train", "lang": "fr", "doc": "[p000] FICHE DE NON-CONFORMITÉ N° NC-2026-0417\nÉmetteur : Service Qualité Client – [ENTREPRISE_A]\nSite : [SITE_1]\n\n[p001] Client : constructeur allemand (rang 1) | Réf. pièce : support moteur SM-77 | Qté livrée : 12 000 | Qté rejetée : 640 | Date réclamation : 03/10/2026\n\n[p002] Description du défaut : bavures et cotes hors tolérance sur l'alésage Ø22 H7, détectées au contrôle réception du client. Le taux de rejet du lot atteint 5,3 %. Pièces issues du centre d'usinage DMG n°4, équipe de nuit.\n\n[p003] Actions immédiates : tri à 100 % chez le client par une société de tri externe (coût refacturé), blocage du stock en interne. Analyse 8D ouverte par [PERSONNE_1].\n\n[p004] Demande au partenaire académique : mener l'analyse des causes racines (5 pourquoi + AMDEC procédé) et proposer un système anti-erreur sur le montage d'usinage.\n\n[p005] Délai : le rapport 8D doit être envoyé au client sous 10 jours ouvrés. Aucune modification du programme CN sans validation du bureau des méthodes.\n\n[p006] Pénalité contractuelle prévue : [DONNEE_MASQUEE] – ne pas diffuser. Numéro de commande client [DONNEE_MASQUEE].", "obj": "- Demande au partenaire académique : mener l'analyse des causes racines (5 pourquoi + AMDEC procédé) et proposer un système anti-erreur sur le montage d'usinage.  [lib_fr_03_p004]", "don": "- Qté rejetée : 640  [lib_fr_03_p001]\n- taux de rejet du lot atteint 5,3 %  [lib_fr_03_p002]", "con": "- le rapport 8D doit être envoyé au client sous 10 jours ouvrés  [lib_fr_03_p005]\n- Aucune modification du programme CN sans validation du bureau des méthodes  [lib_fr_03_p005]"}, {"row": 21, "doc_id": "lib_fr_04", "split": "test", "lang": "fr", "doc": "[p000] Proposition de stage PFE – [ENTREPRISE_A] ([ENTREPRISE_A]), [SITE_1]\n\n[p001] La [ENTREPRISE_A] collecte environ 85 000 litres de lait par jour auprès de 1 200 éleveurs et produit du lait UHT demi-écrémé, des yaourts brassés et du lben. L'usine fonctionne 7j/7.\n\n[p002] Problème : les pertes en ligne sur le conditionnement UHT sont élevées (3,9 % du volume traité), principalement lors des changements de format 1 L / 0,5 L sur la remplisseuse aseptique TBA-19. Chaque changement dure en moyenne 95 minutes.\n\n[p003] Travail demandé : appliquer la méthode SMED pour réduire la durée des changements de format, proposer un standard de nettoyage en place adapté, et chiffrer le gain annuel.\n\n[p004] Le stagiaire devra respecter les règles d'hygiène du plan HACCP (tenue, zones à accès restreint). Les essais ne peuvent avoir lieu que pendant les arrêts programmés du jeudi. Le budget d'investissement est plafonné à 40 000 DT.\n\n[p005] Encadrant entreprise : [PERSONNE_1], responsable production ([DONNEE_MASQUEE]). Gratification : [DONNEE_MASQUEE]. Les [DONNEE_MASQUEE] sont confidentiels.", "obj": "- Travail demandé : appliquer la méthode SMED pour réduire la durée des changements de format, proposer un standard de nettoyage en place adapté, et chiffrer le gain annuel.  [lib_fr_04_p003]", "don": "- 85 000 litres de lait par jour  [lib_fr_04_p001]\n- pertes en ligne sur le conditionnement UHT sont élevées (3,9 % du volume traité)  [lib_fr_04_p002]\n- Chaque changement dure en moyenne 95 minutes  [lib_fr_04_p002]", "con": "- Le stagiaire devra respecter les règles d'hygiène du plan HACCP  [lib_fr_04_p004]\n- Les essais ne peuvent avoir lieu que pendant les arrêts programmés du jeudi  [lib_fr_04_p004]\n- Le budget d'investissement est plafonné à 40 000 DT  [lib_fr_04_p004]"}, {"row": 22, "doc_id": "lib_fr_05", "split": "test", "lang": "fr", "doc": "[p000] CAHIER DES CHARGES FONCTIONNEL – Projet « Zéro papier » en ligne CMS\nDemandeur : [ENTREPRISE_A] ([ENTREPRISE_A]) – [SITE_1]\n\n[p001] 1. Contexte. [ENTREPRISE_A] assemble des cartes électroniques pour l'éclairage public et des compteurs communicants. L'atelier compte 3 lignes CMS (sérigraphie, pose de composants, four de refusion) et un poste de test ICT.\n\n[p002] 2. Problème. Les ordres de fabrication (OF) et les fiches de suivi circulent encore sur papier. Résultat : 2 à 3 erreurs de traçabilité par semaine, et un délai moyen de 26 h entre la fin d'un OF et sa clôture dans l'ERP.\n\n[p003] 3. Besoin. Concevoir une application de saisie sur tablette au poste, reliée à l'ERP Odoo, pour enregistrer les numéros de série, les contrôles AOI et les non-conformités.\n\n[p004] 4. Exigences. L'application doit fonctionner hors connexion pendant au moins 2 heures. Les données ne doivent pas quitter le réseau interne de l'usine. Interface en français et en arabe obligatoire.\n\n[p005] 5. Données fournies. Export anonymisé des OF 2025, plan de l'atelier, liste des postes. Le [DONNEE_MASQUEE] n'est communiqué qu'à l'encadrant académique.\n\n[p006] Contact projet : [PERSONNE_1], ingénieur méthodes – [DONNEE_MASQUEE].", "obj": "- 3. Besoin. Concevoir une application de saisie sur tablette au poste, reliée à l'ERP Odoo, pour enregistrer les numéros de série, les contrôles AOI et les non-conformités.  [lib_fr_05_p003]", "don": "- 2 à 3 erreurs de traçabilité par semaine  [lib_fr_05_p002]\n- délai moyen de 26 h entre la fin d'un OF et sa clôture dans l'ERP  [lib_fr_05_p002]", "con": "- L'application doit fonctionner hors connexion pendant au moins 2 heures  [lib_fr_05_p004]\n- Les données ne doivent pas quitter le réseau interne de l'usine  [lib_fr_05_p004]\n- Interface en français et en arabe obligatoire  [lib_fr_05_p004]"}, {"row": 23, "doc_id": "lib_fr_06", "split": "dev", "lang": "fr", "doc": "[p000] Notes visite usine – 07/10 – [ENTREPRISE_A] ([ENTREPRISE_A]), [SITE_1]\n\n[p001] Accueil par [PERSONNE_1], chef du service environnement. L'usine produit de l'acide phosphorique et du DAP granulé, essentiellement pour l'export.\n\n[p002] Gros sujet = rejets de phosphogypse et émissions de fluor à la cheminée de l'atelier d'attaque. Mesure du dernier audit : 7,4 mg/Nm3 de fluor contre une limite à 5 mg/Nm3. Plaintes répétées de l'association des riverains.\n\n[p003] 2e sujet : colmatage fréquent des filtres à bande, env. 3 arrêts non planifiés/mois, chaque arrêt = ~6 h de production perdue.\n\n[p004] Idées de projets étudiants : (a) modélisation du laveur de gaz et dimensionnement d'un second étage ; (b) maintenance prédictive des filtres à partir des données de pression différentielle.\n\n[p005] Conditions : visite du site uniquement accompagnée, EPI obligatoires ; aucune photo dans la zone d'attaque. Tout rapport doit être relu par le service juridique avant diffusion.\n\n[p006] À ne pas citer : le [DONNEE_MASQUEE] et le [DONNEE_MASQUEE].", "obj": "- Idées de projets étudiants : (a) modélisation du laveur de gaz et dimensionnement d'un second étage ; (b) maintenance prédictive des filtres à partir des données de pression différentielle.  [lib_fr_06_p004]", "don": "- 7,4 mg/Nm3 de fluor contre une limite à 5 mg/Nm3  [lib_fr_06_p002]\n- 3 arrêts non planifiés/mois  [lib_fr_06_p003]\n- ~6 h de production perdue  [lib_fr_06_p003]", "con": "- visite du site uniquement accompagnée  [lib_fr_06_p005]\n- EPI obligatoires  [lib_fr_06_p005]\n- aucune photo dans la zone d'attaque  [lib_fr_06_p005]\n- Tout rapport doit être relu par le service juridique avant diffusion  [lib_fr_06_p005]"}, {"row": 24, "doc_id": "lib_fr_07", "split": "train", "lang": "fr", "doc": "[p000] Objet : Projet entrepôt – urgent avant le peak de décembre\n\n[p001] Salut [PERSONNE_1],\nJe te fais un résumé rapide pour les étudiants. Chez [ENTREPRISE_A] on gère l'entrepôt sous douane de [SITE_1] pour trois enseignes de retail. On reçoit les conteneurs, on fait le picking et le cross-docking vers les magasins.\n\n[p002] Le problème c'est le taux de service : on est à 91 % de commandes livrées complètes et à l'heure, alors que le SLA impose 97 %. Les pickers font beaucoup de déplacements inutiles, le slotting n'a pas été revu depuis 2022 et le WMS génère des listes dans un ordre aberrant.\n\n[p003] Ce qu'il nous faudrait : une analyse ABC des références, un nouveau plan d'implantation, et pourquoi pas une simulation (FlexSim ou Python) pour comparer les scénarios.\n\n[p004] Contraintes : on ne touche pas aux racks fixes de l'allée A (zone douane). La solution doit être opérationnelle avant le 1er décembre. Pas de nouveau logiciel payant.\n\n[p005] On a 14 mois d'historique de commandes (≈ 2,1 millions de lignes). Je ne peux pas partager les [DONNEE_MASQUEE] ni le [DONNEE_MASQUEE] dans le rapport final.\nBonne journée,\n[PERSONNE_2] – Ops Manager – [DONNEE_MASQUEE]", "obj": "- Ce qu'il nous faudrait : une analyse ABC des références, un nouveau plan d'implantation, et pourquoi pas une simulation (FlexSim ou Python) pour comparer les scénarios.  [lib_fr_07_p003]", "don": "- taux de service : on est à 91 % de commandes livrées complètes et à l'heure  [lib_fr_07_p002]", "con": "- le SLA impose 97 %  [lib_fr_07_p002]\n- on ne touche pas aux racks fixes de l'allée A  [lib_fr_07_p004]\n- La solution doit être opérationnelle avant le 1er décembre  [lib_fr_07_p004]\n- Pas de nouveau logiciel payant  [lib_fr_07_p004]"}, {"row": 25, "doc_id": "lib_fr_08", "split": "train", "lang": "fr", "doc": "[p000] FORMULAIRE DE SOUMISSION D'UN PROBLÈME INDUSTRIEL – Programme Industrie-Université\n\n[p001] Raison sociale : [ENTREPRISE_A] | Ville : [SITE_1] | Effectif : 420 | Activité : confection de pantalons chino et de vestes de travail en sous-traitance | Interlocuteur : [PERSONNE_1], responsable méthodes\n\n[p002] Description du problème (5 lignes max) : l'équilibrage des chaînes de couture est fait à l'œil. Sur la chaîne 3, le rendement est de 61 % et les en-cours s'accumulent devant le poste de pose de ceinture. Les délais de livraison au donneur d'ordre ne sont tenus que 70 % du temps.\n\n[p003] Résultat attendu : étude des temps (chronométrage, temps standards), équilibrage de la chaîne 3 et plan de formation des opératrices polyvalentes.\n\n[p004] Contraintes particulières : production non interrompue ; les opératrices ne peuvent pas être filmées ; l'étude doit être terminée avant la collection été 2027.\n\n[p005] Informations confidentielles (ne pas publier) : [DONNEE_MASQUEE], [DONNEE_MASQUEE], [DONNEE_MASQUEE].", "obj": "- Résultat attendu : étude des temps (chronométrage, temps standards), équilibrage de la chaîne 3 et plan de formation des opératrices polyvalentes.  [lib_fr_08_p003]", "don": "- rendement est de 61 %  [lib_fr_08_p002]\n- Les délais de livraison au donneur d'ordre ne sont tenus que 70 % du temps  [lib_fr_08_p002]", "con": "- production non interrompue  [lib_fr_08_p004]\n- les opératrices ne peuvent pas être filmées  [lib_fr_08_p004]\n- l'étude doit être terminée avant la collection été 2027  [lib_fr_08_p004]"}, {"row": 26, "doc_id": "syn_fr_000", "split": "test", "lang": "fr", "doc": "[p000] Objet : proposition d'un sujet de projet pour vos étudiants\n\n[p001] Basée dans [SITE_1], l'entreprise [ENTREPRISE_A] travaille pour un constructeur automobile européen ; sa gamme phare reste la suivante : tissu denim indigo.\n\n[p002] Le problème principal concerne l'équipement suivant : machine de coupe automatique. Indicateur relevé : taux de réclamation de 3 %. Relevés effectués sur le site de [SITE_1].\n\n[p003] Une tentative antérieure pilotée par [PERSONNE_1] sur le poste « machine de coupe automatique » n'a pas suffi ; la direction de [ENTREPRISE_A] à [SITE_1] attend une approche structurée. Gamme touchée : tissu denim indigo.\n\n[p004] Le projet est suivi par [PERSONNE_1] (ingénieur process). Démarche attendue : délavage à la pierre.\n\n[p005] Le partenaire impose les conditions suivantes : la solution doit respecter la norme ISO 13485 ; le budget alloué ne doit pas dépasser 30000 DT.\n\n[p006] L'entreprise fournira les extractions de l'ERP, les relevés du poste « presse à repasser » et l'historique suivant : MTBF de 3 heures. Un atelier de délavage à la pierre a déjà été animé.\n\n[p007] À ne pas diffuser : prix de vente de [DONNEE_MASQUEE]  <h3>Notes (0 = faux/absent · 1 = partiel · 2 = correct)</h3>${C.map(c=>`<div class="crit"><div>${c[1]}<small>${c[2]}</small></div><div class="sc">${[0,1,2].map(v=>`<button data-c="${c[0]}" data-v="${v}" class="${s[c[0]]===v?"on":""} ${v===0?"z":""}">${v}</button>`).join("")}</div></div>`).join("")}
 <div class="tot" id="tot"></div><h3 style="margin-top:12px">Commentaire</h3><textarea id="com" placeholder="Ce qui manque ou ne va pas (facultatif)">${esc(s.commentaire||"")}</textarea></div></div>`;
 m.innerHTML=h;tot();prog();
 document.getElementById("pv").onclick=()=>{if(i>0){i--;render();scrollTo(0,0)}};
 document.getElementById("nx").onclick=()=>{if(i<list.length-1){i++;render();scrollTo(0,0)}};
 m.querySelectorAll(".dot").forEach(e=>e.onclick=()=>{i=+e.dataset.k;render()});
 m.querySelectorAll(".sc button").forEach(b=>b.onclick=()=>{s[b.dataset.c]=+b.dataset.v;save();render()});
 m.querySelectorAll("[data-ref]").forEach(e=>e.onclick=()=>{m.querySelectorAll(".src p").forEach(p=>p.classList.toggle("hl",p.dataset.p===e.dataset.ref));const t=m.querySelector(`.src p[data-p="${e.dataset.ref}"]`);if(t)t.scrollIntoView({block:"center",behavior:"smooth"})});
 document.getElementById("com").oninput=e=>{s.commentaire=e.target.value;save()};
}
function tot(){const s=st[list[i].doc_id];const n=C.filter(c=>s[c[0]]!==undefined).length;const t=C.reduce((a,c)=>a+(s[c[0]]||0),0);
 const el=document.getElementById("tot");if(n<8){el.textContent=`${n}/8 critères notés`;return}
 const ok=t>=13&&s.invention>0&&s.anonymisation>0;el.innerHTML=`Total ${t}/16 — <span style="color:${ok?"var(--acc)":"var(--warn)"}">${ok?"fiche acceptée":"fiche à corriger"}</span>`}
function prog(){document.getElementById("prog").textContent=who?`${list.filter(done).length}/${list.length} fiches notées`:""}
document.getElementById("who").onchange=e=>{who=e.target.value;list=who==="Toutes"?D:D.filter(d=>SETS[who].includes(d.row));i=0;render()};
document.getElementById("exp").onclick=()=>{if(!who||who==="Toutes"){alert("Choisis d'abord ton prénom (Ons ou Boutheina).");return}
 const out=list.filter(done).map(d=>{const s=st[d.doc_id];const r={doc_id:d.doc_id,relu_par:who,commentaire:s.commentaire||""};C.forEach(c=>r[c[0]]=s[c[0]]);return r});
 if(out.length<list.length&&!confirm(`${out.length}/${list.length} fiches complètes seulement. Télécharger quand même ?`))return;
 const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(out,null,1)],{type:"application/json"}));a.download=`relecture_${who.toLowerCase()}.json`;a.click()};
</script></body></html>
