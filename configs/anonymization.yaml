# Politique d'anonymisation du Lot B (caseforge.anonymization.policy, anonymize_document).
#
# Même format que les « remplacements » de data/final/documents_*.jsonl (Lot A) : un pseudonyme entre crochets,
# préfixe en majuscules, souligné, rang du cluster dans le document, dans l'ordre de première apparition :
#   ORG -> [ENTREPRISE_A], [ENTREPRISE_B]… (lettres) ; PERSONNE -> [PERSONNE_1]… ; SITE -> [SITE_1]… (chiffres).
# Écart voulu avec la référence : le Lot A masque toute DONNEE_SENSIBLE par [DONNEE_MASQUEE] ; ici, masque typé
# d'après la forme du span. Les étiquettes absentes de cette politique (non sensibles) sont conservées.
pseudonymes:
  ORG: {prefixe: ENTREPRISE, numerotation: lettres}
  PERSONNE: {prefixe: PERSONNE, numerotation: chiffres}
  SITE: {prefixe: SITE, numerotation: chiffres}
donnee_sensible:
  etiquette: DONNEE_SENSIBLE
  # sous-type (caseforge.eval.donnees_sensibles.sous_type, puis mot « contrat ») -> masque
  masques:
    montant: "[MONTANT]"
    contrat: "[CONTRAT]"
    e-mail: "[EMAIL]"
    téléphone: "[TELEPHONE]"
    contrat / référence: "[REFERENCE]"
    autre: "[REFERENCE]"
  masque_reference_lot_a: "[DONNEE_MASQUEE]"   # pour comparer avec text_anonymise de référence
# ---------- Gel Gold (24/11/2026, commit 2cef770) ----------
# G4 (results/lotb_gold/g4_anonymisation_v4.md, .json ; scripts/g4_anonymisation_v4.py) : même système que le gel
# Silver, seul fichier_predictions change : XLM-R v4 du Lot C (origin/lot-c-gold, commit 8a0581d ; fichiers
# reports/predictions/xlmr_v4_dev_s13/_s42/_s2026.jsonl ajoutés en 0b47a2e, récupérés seuls, sans fusion).
# Règle écrite dans experiments.md AVANT la mesure (commit a2f5bfb) : v4 remplace le Silver si la fuite moyenne
# (3 graines) ne monte pas et si le sur-masquage moyen ne monte pas de plus de 2 points ; fusion_fichier,
# coreference, balayage et generaliser ne sont pas réajustés.
# Mesure (dev, 21 documents, 213 occurrences sensibles, moyenne ± écart-type sur s13 / s42 / s2026) :
#   v4     : fuite 1,3 ± 0,2 %, sur-masquage 9,2 ± 0,9 %, F1 caractère 0,834 ± 0,024 (DONNEE_SENSIBLE 0,871)
#   Silver : fuite 2,5 ± 0,6 %, sur-masquage 9,4 ± 0,7 %, F1 caractère 0,794 ± 0,014 (DONNEE_SENSIBLE 0,917)
#   Δ v4 − Silver : fuite −1,3 pt (baisse démontrée 1/3 graines seulement), sur-masquage −0,1 pt (non démontré)
# -> v4 retenu (règle appliquée telle quelle) : fichier_predictions = xlmr_v4_dev_s42.jsonl (graine s42, comme au
# Silver). Le gel Silver ci-dessous reste la trace de la configuration précédente (toutes les autres options sont
# inchangées) ; ses prédictions restent dans reports/predictions/xlmr_dev_s42.jsonl.
# ---------- Gel Silver (étape 6, 14/11/2026) ----------
# Mesures : dev (documents_dev.jsonl, 21 documents, 213 occurrences sensibles), XLM-R du Lot C = 3 graines officielles
# (s13, s42, s2026), moyenne ± écart-type ; rapports results/lotb_silver/b12 à b16.
# Système Silver par défaut : union_fichier + bornes DS + coréférence + balayage, generaliser false.
#   fuite 2,5 ± 0,6 %, sur-masquage 9,4 ± 0,7 %, F1 caractère 0,794 ± 0,014 (b16_ablations.md, ligne bornes_regles_DS)
#   contre Bronze union_seuil 6,6 % / 21,9 % / 0,628.
# Bronze toujours accessible : backend union_seuil (anonymize_document(doc, "union_seuil") ; c'est aussi le défaut de
# l'API caseforge.anonymization.anonymiser, qui travaille sur un texte libre sans prédictions XLM-R).
#
# backend : défaut de anonymize_document quand aucun backend n'est donné.
# Mesure (b14_xlmr.md, b16_ablations.md) : union_fichier(xlmr) fuite 2,5 ± 0,6 % contre rules 10,8 %, union_seuil
# 6,6 %, union_fichier(crf) 6,6 % ; hausse de fuite démontrée (IC 95 % apparié, 3/3 graines) pour chacun des trois.
# Règle : la détection de fuite la plus basse, la fuite étant la métrique principale (CLAUDE.md §6).
# LIMITE : union_fichier lit fichier_predictions, qui n'existe que pour le dev ; un passage absent du fichier n'a
# aucune prédiction du fichier et union_fichier revient alors à rules (test, texte libre : voir la carte du modèle).
backend: union_fichier
# fusion_fichier : fusion des entités du fichier avec les règles dans union_fichier.
#   union : union des spans (B13, B14) ; bornes_ds : une entité du fichier qui chevauche une DONNEE_SENSIBLE des règles
#   est écartée, les bornes des règles sont gardées (B16, detect.fusionner_bornes_ds).
# Mesure (b16_ablations.md) : bornes_ds contre union, Δ fuite +0,0 ± 0,0 pt, sur-masquage 14,7 -> 9,4 % (baisse
# démontrée 3/3 graines), F1 caractère DONNEE_SENSIBLE 0,593 -> 0,917.
# Règle fixée avant la mesure (REGLE_BORNES_DS) : retenue si la fuite moyenne ne monte pas de plus de 1 point et si la
# F1 caractère DONNEE_SENSIBLE moyenne monte -> retenue.
fusion_fichier: bornes_ds
# Options par défaut de anonymize_document (les ablations les changent)
# coreference — mesure (b16) : retirée, masques identiques (Δ fuite 0) mais cohérence des pseudonymes 84,1 -> 26,2 %.
# Règle : une option qui ne coûte rien en fuite et garde la cohérence des pseudonymes est gardée -> gardée.
coreference: true   # coref_simple : formes normalisées, sigles, nom de famille seul, initiales
# balayage — mesure (b16) : retiré, Δ fuite 0 au dev, sur-masquage 14,7 -> 12,2 % (baisse démontrée 2/3 graines
# seulement). Règle : pas de changement sans effet démontré sur les 3 graines (21 documents) -> gardé, comme
# protection contre les formes répétées non détectées.
balayage: true      # second passage : formes déjà remplacées retrouvées ailleurs dans le document
balayage_longueur_min: 3   # caractères non blancs d'une forme pour qu'elle soit recherchée (sigles : 2)
# B12 (Silver) : généralisation des indices rares. Vrai : les PRODUIT et EQUIPEMENT détectés sont remplacés par leur
# famille (data/lexicons/familles_produits.txt, categories_equipements.txt, générés depuis le train par
# scripts/b12_lexiques.py ; forme inconnue -> [PRODUIT] / [EQUIPEMENT]), avec coréférence et balayage.
# Faux par défaut : sortie identique au Bronze.
# Mesure (b12_generalisation.md, b16_ablations.md) : fuite inchangée (Δ 0), documents ré-identifiables N2 20 -> 2 sur
# 21, mais F1 de la fiche −5,8 points. Règle : non retenue si la F1 de la fiche baisse de plus de 3 points -> false.
generaliser: false
# B6c : second passage renforcé (variantes sans article, ORG sans le pays, nom de famille seul, translittération
# simple arabe <-> latin ; caseforge.anonymization.anonymizer.variantes_balayage, squelette_mot).
balayage_renforce: true
# B6c : règles de rappel ajoutées à la détection « rules » (donc à union_seuil) ; retirer une règle pour la
# désactiver. Règle : désactivée si elle augmente le sur-masquage de plus de 3 points (mesure sur le dev, sans
# réajustement).
regles_rappel: [rappel.org_sigle, rappel.org_camelcase, rappel.personne_prenom_ar]
# B6d : réduction du sur-masquage de union_seuil (caseforge.anonymization.detect ; mesure : scripts/b6d_cv.py sur le
# train, scripts/b6d_eval_dev.py sur le dev). Règle : une correction qui augmente la fuite de plus de 1 point est
# désactivée ici, sans réajustement sur le dev.
fusion_crf: union           # union : union des spans (B6b, B6c) ; regles : bornes des règles (B6d, désactivée : fuite train +4,6 pt)
plafonds_contrainte: true   # montant DONNEE_SENSIBLE contenu dans une CONTRAINTE détectée -> non masqué (cas 5)
extension_montants: true   # B6b : DONNEE_SENSIBLE qui touche un nombre -> nombre complet + devise (detect.etendre_montants)
# Backend union_seuil (B6b) : rules ∪ entités du CRF dont la confiance atteint le seuil de leur étiquette.
# Choisis par validation croisée en 5 plis groupés par document sur le TRAIN (scripts/b6b_union_seuil_cv.py,
# results/lotb/b6b_union_seuil_cv.json) : fuite minimale sous la contrainte sur-masquage <= 10 %. null = aucune
# entité du CRF pour cette étiquette.
# Résultat (27/10/2026) : minimum, à fuite égale avec moyenne (2,9 %) et sur-masquage plus faible (2,5 % contre 3,3 %).
# B6e (27/10/2026, scripts/b6e_plis_gabarit_cv.py puis scripts/b6e_eval_dev.py) : seuils rechoisis avec des plis
# groupés par gabarit (moyenne 0,35 / aucun / 0,70 / 0,35), NON retenus : au dev, fuite +1,9 pt et sur-masquage
# +2,7 pt (règle : fuite <= +1 pt et sur-masquage en baisse). Seuils B6b ci-dessous inchangés.
# B13 (Silver) : backends « fichier » et « union_fichier » (caseforge.anonymization.detect). Fichier de prédictions
# JSONL {passage_id, entities: [{start, end, label}]} ; seules les étiquettes sensibles sont gardées ; chemin relatif
# à la racine du dépôt, surchargeable par l'argument fichier / fichier_predictions. Un passage absent du fichier n'a
# aucune prédiction (avertissement et compteur detect.passages_absents).
# Gel Silver : XLM-R s42 du Lot C (origin/lot-c-silver, commit 1c6901e ; point de contrôle choisi sur le dev par le
# Lot C). Les chiffres à citer sont la moyenne des 3 graines officielles (b14_xlmr.md, b16_ablations.md) ; s42 seule :
# voir b16_ablations_dev.json. Dev seulement : pour le test, fichier_predictions doit pointer vers des prédictions
# XLM-R sur le test (scripts/final_eval.py) ; sans elles, union_fichier revient à rules.
# B13 : reports/predictions/crf_dev.jsonl (union_fichier(crf), fuite 6,6 %, sur-masquage 27,2 %).
# Gel Gold (24/11/2026, G4, commit 2cef770) : XLM-R v4 s42 (origin/lot-c-gold 8a0581d) ; gel Silver : xlmr_dev_s42.jsonl.
fichier_predictions: reports/predictions/xlmr_v4_dev_s42.jsonl
union_seuil:
  agregation: minimum
  seuils: {ORG: 0.35, PERSONNE: 0.8, SITE: 0.55, DONNEE_SENSIBLE: 0.3}
