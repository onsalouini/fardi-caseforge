[project]
name = "caseforge"
version = "0.1.0"
description = "CaseForge, Lot B : extraction, anonymisation et évaluation"
requires-python = ">=3.11"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["caseforge*"]

[tool.ruff]
target-version = "py311"
line-length = 120
# Lot A figé : on ne le reformate pas
extend-exclude = ["cfdata", "exemples", "tests/simulate_human.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
