[project]
name = "caseforge"
version = "0.1.0"
description = "CaseForge, Lot B : extraction, anonymisation et évaluation"
requires-python = ">=3.11"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["caseforge*"]

[tool.ruff]
target-version = "py311"
line-length = 120
# Lot A figé : on ne le reformate pas
extend-exclude = ["cfdata", "exemples", "tests/simulate_human.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Notebooks Kaggle du Lot D : les commandes shell (`!python … {g}`) utilisent les variables de boucle (que ruff ne
# voit pas : faux B007) et ne se coupent pas sur plusieurs lignes (E501).
"notebooks/lot_d_*.ipynb" = ["B007", "E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# Tests lents, lancés par défaut ; les exclure avec : pytest -m "not slow"
markers = ["slow: test lent (plus de 30 s : pipeline complet sur les documents du dev)"]
